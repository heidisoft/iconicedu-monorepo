name: Prepare native classroom tests
description: Install pinned tools and build shared packages without deployment credentials
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 10.33.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Install dependencies and shared packages
      shell: bash
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        pnpm build:packages
        pnpm --filter mobile canvas:build
    - name: Install verified Maestro CLI
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error --retry 2 \
          https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip \
          --output "$RUNNER_TEMP/maestro.zip"
        EXPECTED=5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/maestro.zip" | cut -d ' ' -f 1)
        [[ "$ACTUAL" == "$EXPECTED" ]] || { echo 'Maestro checksum mismatch'; exit 1; }
        unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
        echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
