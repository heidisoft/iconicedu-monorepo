name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# Cancel in-progress runs for the same branch/PR when a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Code quality — format · lint · typecheck
  # PRs: affected packages only (fast feedback)
  # ──────────────────────────────────────────────────────────────
  quality:
    # Branch protection depends on this exact job name.
    # If you rename it, update .github/branch-protection/main.json and
    # scripts/github/apply-branch-protection.sh in the same change.
    name: Quality (format · lint · typecheck)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch enough history for turbo --affected to compare against the base
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-

      # Generate Prisma client from schema — required before API typecheck.
      # Does not connect to a real database; it only reads prisma/schema.prisma.
      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      # Build shared packages so apps can resolve workspace imports.
      - name: Build shared packages
        run: pnpm build:packages

      # Always check all files — prettier is fast enough to run unconditionally.
      - name: Format check
        run: pnpm format:check

      # Temporarily disabled in GitHub Actions. Keep the local script in package.json
      # so the guard can be re-enabled here without reintroducing the implementation.
      # - name: Guard feature flags
      #   run: pnpm guard:feature-flags

      # PRs: only affected packages.
      - name: Lint + Typecheck
        run: pnpm exec turbo run lint typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # ──────────────────────────────────────────────────────────────
  # Job 2: Tests.
  # PRs: affected packages only. Push to main: all packages.
  # ──────────────────────────────────────────────────────────────
  test:
    # Branch protection depends on this exact job name.
    # If you rename it, update .github/branch-protection/main.json and
    # scripts/github/apply-branch-protection.sh in the same change.
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-

      - name: Build shared packages
        run: pnpm build:packages

      # PRs: only affected packages. Push to main: all packages.
      - name: Test
        run: pnpm exec turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          CI: true
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # ──────────────────────────────────────────────────────────────
  # Job 3: Bundle sizes — compares PR sizes (measured in build job)
  # against main branch sizes (cached or built on-demand).
  # Depends on build to ensure apps are built before comparison.
  # ──────────────────────────────────────────────────────────────
  bundle-size:
    name: Bundle Size
    if: github.event.action != 'closed'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Download PR sizes artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: pr-sizes
          path: /tmp

      # Write the measurement script once — reused for base build (if cache misses).
      - name: Write measurement script
        run: |
          cat > /tmp/measure.js << 'EOF'
          const fs = require('fs'), path = require('path'), zlib = require('zlib');
          function walk(dir, exts) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(full, exts));
              else if (exts.some(x => e.name.endsWith(x)) && !e.name.endsWith('.map')) out.push(full);
            }
            return out;
          }
          function measure(dir, exts) {
            const files = walk(dir, exts);
            let raw = 0, gz = 0;
            const top = [];
            for (const f of files) {
              const buf = fs.readFileSync(f);
              const gzLen = zlib.gzipSync(buf).length;
              raw += buf.length; gz += gzLen;
              top.push({ name: path.basename(f), gz: gzLen });
            }
            top.sort((a, b) => b.gz - a.gz);
            return { raw, gz, count: files.length, top: top.slice(0, 5) };
          }
          const out = {
            web:    { js: measure('apps/web/.next/static', ['.js']), css: measure('apps/web/.next/static', ['.css']) },
            mobile: { js: measure('apps/mobile/.expo/dist/_expo/static/js', ['.js', '.hbc']) },
            api:    { js: measure('apps/api/dist', ['.js']) },
          };
          process.stdout.write(JSON.stringify(out));
          EOF

      # ── Try to restore cached base/main branch sizes ────────────
      # The PR base SHA is the invalidation signal. When main moves,
      # the key changes and we rebuild the base sizes once.
      - name: Restore main branch sizes from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/base-sizes.json
          key: bundle-sizes-base-${{ runner.os }}-${{ github.event.pull_request.base.sha }}

      # ── Base/main branch build (only if cache missed) ───────────
      - name: Checkout base branch
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: git checkout origin/${{ github.base_ref }}

      - name: Install dependencies (base)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Set base build env vars
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          echo "API_URL=${_API_URL:-https://placeholder-api.iconicedu.test}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_URL=${_API_URL:-https://placeholder-api.iconicedu.test}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_API_URL=${_API_URL:-https://placeholder-api.iconicedu.test}" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${_SRK:-placeholder-service-role-key}" >> "$GITHUB_ENV"
        env:
          _API_URL: ${{ secrets.API_URL }}
          _URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          _PUBLISHABLE: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # continue-on-error: base may differ enough to fail a sub-build;
      # missing data renders as "—" in the comment rather than blocking.
      - name: Build all apps (base branch)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pnpm --filter api db:generate || true
          pnpm build:packages
          pnpm --filter web build
          (cd apps/mobile && npx expo export --platform android --output-dir .expo/dist) || true
          pnpm --filter api build || true
        env:
          EXPO_NO_TELEMETRY: 1
          TURBO_TELEMETRY_DISABLED: 1

      - name: Measure base branch sizes
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: node /tmp/measure.js > /tmp/base-sizes.json

      - name: Save base branch sizes to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/base-sizes.json
          key: bundle-sizes-base-${{ runner.os }}-${{ github.event.pull_request.base.sha }}

      # If cache hit, /tmp/base-sizes.json already exists from restore step
      - name: Confirm cached base sizes
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: test -f /tmp/base-sizes.json

      - name: Combine into bundle-sizes artifact
        run: |
          node -e "
            const pr   = JSON.parse(require('fs').readFileSync('/tmp/pr-sizes.json', 'utf8'));
            const base = JSON.parse(require('fs').readFileSync('/tmp/base-sizes.json', 'utf8'));
            require('fs').writeFileSync('/tmp/bundle-sizes.json', JSON.stringify({ pr, base }));
          "

      - name: Upload bundle sizes artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-sizes
          path: /tmp/bundle-sizes.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 4: Build apps + measure PR sizes
  # Builds all three apps on the PR branch once, measures bundle sizes,
  # uploads measurement artifact for bundle-size job to use for comparison.
  # ──────────────────────────────────────────────────────────────
  build:
    # Branch protection depends on this exact job name.
    # If you rename it, update .github/branch-protection/main.json and
    # scripts/github/apply-branch-protection.sh in the same change.
    name: Build
    if: github.event.action != 'closed'
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Set build env vars
        run: |
          echo "SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${_PUBLISHABLE:-placeholder-publishable-key}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${_SRK:-placeholder-service-role-key}" >> "$GITHUB_ENV"
        env:
          _URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          _PUBLISHABLE: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Write measurement script
        run: |
          cat > /tmp/measure.js << 'EOF'
          const fs = require('fs'), path = require('path'), zlib = require('zlib');
          function walk(dir, exts) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(full, exts));
              else if (exts.some(x => e.name.endsWith(x)) && !e.name.endsWith('.map')) out.push(full);
            }
            return out;
          }
          function measure(dir, exts) {
            const files = walk(dir, exts);
            let raw = 0, gz = 0;
            const top = [];
            for (const f of files) {
              const buf = fs.readFileSync(f);
              const gzLen = zlib.gzipSync(buf).length;
              raw += buf.length; gz += gzLen;
              top.push({ name: path.basename(f), gz: gzLen });
            }
            top.sort((a, b) => b.gz - a.gz);
            return { raw, gz, count: files.length, top: top.slice(0, 5) };
          }
          const out = {
            web:    { js: measure('apps/web/.next/static', ['.js']), css: measure('apps/web/.next/static', ['.css']) },
            mobile: { js: measure('apps/mobile/.expo/dist/_expo/static/js', ['.js', '.hbc']) },
            api:    { js: measure('apps/api/dist', ['.js']) },
          };
          process.stdout.write(JSON.stringify(out));
          EOF

      - name: Build all apps (PR branch)
        run: |
          pnpm build:packages
          pnpm --filter web build
          (cd apps/mobile && npx expo export --platform android --output-dir .expo/dist)
          pnpm --filter api build
        env:
          API_URL: ${{ secrets.API_URL || 'https://placeholder-api.iconicedu.test' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL || 'https://placeholder-api.iconicedu.test' }}
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'https://placeholder-api.iconicedu.test' }}
          EXPO_NO_TELEMETRY: 1
          TURBO_TELEMETRY_DISABLED: 1

      - name: Measure PR branch sizes
        run: node /tmp/measure.js > /tmp/pr-sizes.json

      - name: Upload PR sizes artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-sizes
          path: /tmp/pr-sizes.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 5: Verify Preview Environment Status
  # Runs after build + bundle-size both complete. Creates a
  # Supabase preview branch, deploys Railway API, configures
  # Vercel env vars, and posts a unified PR comment.
  # ──────────────────────────────────────────────────────────────
  preview-environment:
    name: Verify Preview Environment Status
    if: github.event.action != 'closed'
    needs: [build, bundle-size]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH_NAME: ${{ github.head_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # bundle-sizes is produced by the bundle-size job in this same run —
      # no run-id needed; download-artifact defaults to the current workflow run.
      - name: Download bundle sizes artifact
        id: bundle-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bundle-sizes
          path: /tmp/artifacts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 1. Create Supabase preview branch (idempotent — skips if already exists)
      - name: Create Supabase branch
        id: supabase-branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Use the GitHub branch name — stable across pushes to the same PR branch.
          SUPABASE_BRANCH="${BRANCH_NAME}"

          EXISTING_ID=$(supabase branches list \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --output json \
            | jq -r --arg name "$SUPABASE_BRANCH" '.[] | select(.name==$name) | .id // ""')

          if [[ -n "$EXISTING_ID" ]]; then
            echo "Branch $SUPABASE_BRANCH already exists — skipping create and seed"
            echo "branch_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating branch: $SUPABASE_BRANCH"
            supabase branches create "$SUPABASE_BRANCH" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --region ap-southeast-1
            echo "branch_new=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Waiting for branch migrations to complete..."
          for i in $(seq 1 30); do
            BRANCH_DATA=$(supabase branches list \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --output json \
              | jq --arg name "$SUPABASE_BRANCH" '.[] | select(.name==$name)')

            STATUS=$(echo "$BRANCH_DATA" | jq -r '.status // ""')
            BRANCH_ID=$(echo "$BRANCH_DATA" | jq -r '.id // ""')

            echo "  Status: ${STATUS:-(pending)}"

            if [[ "$STATUS" == "MIGRATIONS_PASSED" || "$STATUS" == "FUNCTIONS_DEPLOYED" || "$STATUS" == "FUNCTIONS_FAILED" ]]; then
              echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
              BRANCH_REF=$(echo "$BRANCH_DATA" | jq -r '.project_ref // .ref // ""')
              echo "branch_ref=$BRANCH_REF" >> "$GITHUB_OUTPUT"
              if [[ "$STATUS" == "FUNCTIONS_FAILED" ]]; then
                echo "::warning::Supabase branch reports FUNCTIONS_FAILED; continuing because this workflow reapplies secrets and redeploys functions later."
              fi
              break
            elif [[ "$STATUS" == "MIGRATIONS_FAILED" ]]; then
              echo "::error::Supabase branch migrations failed"
              exit 1
            fi

            if [[ $i -eq 30 ]]; then
              echo "::error::Timed out waiting for Supabase branch"
              exit 1
            fi
            sleep 10
          done

      # 2. Fetch branch credentials
      - name: Fetch branch credentials
        id: branch-creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_REF="${{ steps.supabase-branch.outputs.branch_ref }}"

          if [[ -z "$BRANCH_REF" || "$BRANCH_REF" == "null" ]]; then
            echo "::error::branch_ref is empty — branches list did not return a project_ref for this branch"
            exit 1
          fi
          echo "Branch project ref: $BRANCH_REF"

          BRANCH_CONFIG=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/branches/${BRANCH_REF}")

          DB_HOST=$(echo "$BRANCH_CONFIG" | jq -r '.db_host')
          DB_PORT=$(echo "$BRANCH_CONFIG" | jq -r '.db_port')
          DB_USER=$(echo "$BRANCH_CONFIG" | jq -r '.db_user')
          DB_PASS=$(echo "$BRANCH_CONFIG" | jq -r '.db_pass')
          JWT_SECRET=$(echo "$BRANCH_CONFIG" | jq -r '.jwt_secret')

          if [[ -z "$DB_HOST" || "$DB_HOST" == "null" || -z "$DB_PORT" || "$DB_PORT" == "null" || -z "$DB_USER" || "$DB_USER" == "null" || -z "$DB_PASS" || "$DB_PASS" == "null" ]]; then
            echo "::error::Supabase branch config did not include database credentials"
            exit 1
          fi

          DB_PASS_ENCODED=$(jq -nr --arg v "$DB_PASS" '$v|@uri')
          DIRECT_URL="postgresql://${DB_USER}:${DB_PASS_ENCODED}@${DB_HOST}:${DB_PORT}/postgres"
          POOLER_DB_USER="$DB_USER"
          if [[ "$POOLER_DB_USER" != *".${BRANCH_REF}" ]]; then
            POOLER_DB_USER="${POOLER_DB_USER}.${BRANCH_REF}"
          fi

          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/api-keys" \
            | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "::add-mask::$ANON_KEY"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"

          SERVICE_ROLE_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/api-keys" \
            | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "service_role_key=$SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"

          POOLER_CONFIG=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/config/database/pooler")
          PGBOUNCER_CONFIG=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/config/database/pgbouncer" \
            || echo '{}')

          DATABASE_URL=$(echo "$POOLER_CONFIG" | jq -r '
            if type == "array" then
              map(select((.pool_mode // "") == "transaction" or (.db_port // 0) == 6543))[0].connectionString
              // map(select((.pool_mode // "") == "transaction" or (.db_port // 0) == 6543))[0].connection_string
              // .[0].connectionString
              // .[0].connection_string
              // empty
            elif type == "object" then
              .connectionString // .connection_string // empty
            else
              empty
            end')
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "null" ]]; then
            DATABASE_URL=$(echo "$PGBOUNCER_CONFIG" | jq -r '.connectionString // .connection_string // empty')
          fi
          # Use session mode for administrative psql commands in CI. Direct branch
          # hosts are often IPv6-only, while GitHub runners reliably reach the IPv4
          # pooler endpoint on port 5432.
          ADMIN_DATABASE_URL=$(echo "$POOLER_CONFIG" | jq -r '
            if type == "array" then
              map(select((.pool_mode // "") == "session" or (.db_port // 0) == 5432))[0].connectionString
              // map(select((.pool_mode // "") == "session" or (.db_port // 0) == 5432))[0].connection_string
              // map(select((.pool_mode // "") == "transaction" or (.db_port // 0) == 6543))[0].connectionString
              // map(select((.pool_mode // "") == "transaction" or (.db_port // 0) == 6543))[0].connection_string
              // .[0].connectionString
              // .[0].connection_string
              // empty
            elif type == "object" then
              .connectionString // .connection_string // empty
            else
              empty
            end')
          if [[ -z "$ADMIN_DATABASE_URL" || "$ADMIN_DATABASE_URL" == "null" ]]; then
            ADMIN_DATABASE_URL=$(echo "$PGBOUNCER_CONFIG" | jq -r '.connectionString // .connection_string // empty')
          fi

          # Branches use branch-specific DB passwords and a branch-qualified user
          # when connecting through Supavisor / poolers.
          if [[ -n "$DATABASE_URL" && "$DATABASE_URL" != "null" ]]; then
            DATABASE_URL="postgresql://${POOLER_DB_USER}:${DB_PASS_ENCODED}@${DATABASE_URL#*@}"
          fi
          if [[ -n "$ADMIN_DATABASE_URL" && "$ADMIN_DATABASE_URL" != "null" ]]; then
            ADMIN_DATABASE_URL="postgresql://${POOLER_DB_USER}:${DB_PASS_ENCODED}@${ADMIN_DATABASE_URL#*@}"
          fi

          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" == "null" || -z "$DIRECT_URL" || "$DIRECT_URL" == "null" || -z "$ADMIN_DATABASE_URL" || "$ADMIN_DATABASE_URL" == "null" ]]; then
            echo "::warning::Supabase pooler config payload: $(echo "$POOLER_CONFIG" | jq -c 'if type == "array" then map({pool_mode,db_host,db_port,has_connection:(has("connectionString") or has("connection_string"))}) else {type:(type),keys:(keys // [])} end' 2>/dev/null || echo unavailable)"
            echo "::warning::Supabase pgbouncer config payload: $(echo "$PGBOUNCER_CONFIG" | jq -c '{pool_mode,db_host,db_port,has_connection:(has("connectionString") or has("connection_string"))}' 2>/dev/null || echo unavailable)"
            echo "::error::Supabase database config did not include the required connection strings"
            exit 1
          fi

          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DIRECT_URL"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          # Prefer the CLI's documented env var over --password so secrets do not
          # show up in process args and can be reused by later Supabase CLI steps.
          echo "SUPABASE_DB_PASSWORD=$DB_PASS" >> "$GITHUB_ENV"
          echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT_URL" >> "$GITHUB_OUTPUT"
          echo "admin_database_url=$ADMIN_DATABASE_URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$JWT_SECRET"
          echo "jwt_secret=$JWT_SECRET" >> "$GITHUB_OUTPUT"

          echo "branch_api_url=https://${BRANCH_REF}.supabase.co" >> "$GITHUB_OUTPUT"

      # 3. Configure Railway PR environment env vars and deploy.
      # Uses the Railway GraphQL API to:
      #   1. Find the PR environment by name
      #   2. Find the service ID dynamically from the project (avoids stale RAILWAY_SERVICE_ID)
      #   3. Set env vars on the service in the PR environment
      #   4. Trigger a deploy
      #   5. Fetch the already-assigned service domain for the environment
      - name: Configure Railway PR environment
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "::error::PR_NUMBER is empty"
            exit 1
          fi

          REPO_NAME="${{ github.event.repository.name }}"
          ENV_NAME="${REPO_NAME}-pr-${PR_NUMBER}"
          SERVICE_NAME="${REPO_NAME}"
          GQL="https://backboard.railway.app/graphql/v2"

          api() {
            local body="$1"
            local resp
            resp=$(curl -sf \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              "$GQL" \
              -d "$body") || { echo "::error::Railway API HTTP request failed"; exit 1; }
            local errs
            errs=$(echo "$resp" | jq -r 'if .errors then .errors | map(.message) | join(", ") else empty end')
            if [[ -n "$errs" ]]; then
              echo "::error::Railway GQL error: $errs"
              exit 1
            fi
            echo "$resp"
          }

          # Step 1: Find the PR environment ID by name
          # Ref: https://docs.railway.com/integrations/api/manage-environments
          echo "Looking up Railway PR environment: $ENV_NAME"
          ENV_RESP=$(api "$(jq -n --arg pid "$RAILWAY_PROJECT_ID" \
            '{query:"query environments($projectId: String!) { environments(projectId: $projectId) { edges { node { id name } } } }", variables:{projectId:$pid}}')")
          ENV_ID=$(echo "$ENV_RESP" | jq -r --arg name "$ENV_NAME" \
            '.data.environments.edges[]? | select(.node.name==$name) | .node.id // empty')

          if [[ -z "$ENV_ID" ]]; then
            echo "::error::Railway PR environment '$ENV_NAME' not found. Ensure PR Environments is enabled in Railway."
            exit 1
          fi
          echo "Found environment: $ENV_NAME ($ENV_ID)"

          # Step 2: Find the service ID by name from the project's services list.
          # This avoids relying on RAILWAY_SERVICE_ID which points to the production service.
          # Ref: https://docs.railway.com/integrations/api/manage-projects
          echo "Looking up service by name: $SERVICE_NAME"
          PROJECT_RESP=$(api "$(jq -n --arg pid "$RAILWAY_PROJECT_ID" \
            '{query:"query project($id: String!) { project(id: $id) { services { edges { node { id name } } } } }", variables:{id:$pid}}')")
          SERVICE_ID=$(echo "$PROJECT_RESP" | jq -r --arg name "$SERVICE_NAME" \
            '.data.project.services.edges[]? | select(.node.name==$name) | .node.id // empty')

          if [[ -z "$SERVICE_ID" ]]; then
            echo "::error::Railway service '$SERVICE_NAME' not found in project. Available services:"
            echo "$PROJECT_RESP" | jq -r '.data.project.services.edges[]?.node.name'
            exit 1
          fi
          echo "Found service: $SERVICE_NAME ($SERVICE_ID)"

          # Step 3: Set env vars on the service in the PR environment.
          # skipDeploys:true so we control the deploy trigger ourselves in the next step.
          # Ref: https://docs.railway.com/integrations/api/manage-variables
          VARS_JSON=$(jq -n \
            --arg db    "${{ steps.branch-creds.outputs.database_url }}" \
            --arg dir   "${{ steps.branch-creds.outputs.direct_url }}" \
            --arg surl  "${{ steps.branch-creds.outputs.branch_api_url }}" \
            --arg srkey "${{ steps.branch-creds.outputs.service_role_key }}" \
            --arg anon  "${{ steps.branch-creds.outputs.anon_key }}" \
            --arg jwt   "${{ steps.branch-creds.outputs.jwt_secret }}" \
            --arg act   "${{ secrets.INTERNAL_ACTIVITY_FEED_TOKEN }}" \
            --arg act_p "${{ secrets.INTERNAL_ACTIVITY_PROJECTOR_TOKEN || secrets.INTERNAL_ACTIVITY_FEED_TOKEN }}" \
            --arg act_w "${{ secrets.INTERNAL_ACTIVITY_WORKER_TOKEN }}" \
            --arg rem   "${{ secrets.INTERNAL_REMINDERS_TOKEN }}" \
            --arg evt   "${{ secrets.INTERNAL_EVENTS_TOKEN_API || secrets.INTERNAL_EVENTS_TOKEN || secrets.INTERNAL_ACTIVITY_WORKER_TOKEN }}" \
            --arg expo  "${{ secrets.EXPO_ACCESS_TOKEN }}" \
            --arg phk   "${{ secrets.POSTHOG_KEY }}" \
            --arg phh   "${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" \
            '{DATABASE_URL:$db, DIRECT_URL:$dir, SUPABASE_URL:$surl,
              SUPABASE_SERVICE_ROLE_KEY:$srkey, SUPABASE_ANON_KEY:$anon, JWT_SECRET:$jwt,
              INTERNAL_ACTIVITY_FEED_TOKEN:$act,
              INTERNAL_ACTIVITY_PROJECTOR_TOKEN:$act_p,
              INTERNAL_ACTIVITY_WORKER_TOKEN:$act_w,
              INTERNAL_EVENTS_TOKEN_API:$evt,
              INTERNAL_REMINDERS_TOKEN_API:$rem,
              EXPO_ACCESS_TOKEN:$expo,
              NODE_ENV:"production", NEXT_PUBLIC_APP_ENV:"preview",
              POSTHOG_KEY:$phk, POSTHOG_HOST:$phh}')

          api "$(jq -n \
            --arg pid "$RAILWAY_PROJECT_ID" \
            --arg eid "$ENV_ID" \
            --arg sid "$SERVICE_ID" \
            --argjson vars "$VARS_JSON" \
            '{query:"mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }",
              variables:{input:{projectId:$pid, environmentId:$eid, serviceId:$sid, variables:$vars, skipDeploys:true}}}')" > /dev/null
          echo "Variables set."

          # Step 4: Trigger a deploy for the service in the PR environment.
          # Ref: https://docs.railway.com/integrations/api/manage-deployments
          echo "Triggering deploy for service $SERVICE_NAME in environment $ENV_NAME..."
          api "$(jq -n \
            --arg pid "$RAILWAY_PROJECT_ID" \
            --arg sid "$SERVICE_ID" \
            --arg eid "$ENV_ID" \
            '{query:"mutation environmentTriggersDeploy($input: EnvironmentTriggersDeployInput!) { environmentTriggersDeploy(input: $input) }", variables:{input:{projectId:$pid, serviceId:$sid, environmentId:$eid}}}')" > /dev/null
          echo "Deploy triggered. Continuing without waiting for build completion."

          # Step 5: Fetch the environment/service domain that Railway already assigned.
          # Ref: https://docs.railway.com/integrations/api/manage-domains
          echo "Fetching Railway service domain..."
          DOMAIN_RESP=$(api "$(jq -n \
            --arg pid "$RAILWAY_PROJECT_ID" \
            --arg eid "$ENV_ID" \
            --arg sid "$SERVICE_ID" \
            '{query:"query domains($projectId: String!, $environmentId: String!, $serviceId: String!) { domains(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) { serviceDomains { domain } customDomains { domain } } }", variables:{projectId:$pid, environmentId:$eid, serviceId:$sid}}')")
          RAILWAY_DOMAIN=$(echo "$DOMAIN_RESP" | jq -r \
            '.data.domains.serviceDomains[0]?.domain // .data.domains.customDomains[0]?.domain // empty')

          if [[ -z "$RAILWAY_DOMAIN" ]]; then
            echo "::warning::No Railway domain is currently assigned to $SERVICE_NAME in $ENV_NAME"
            echo "railway_api_url=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FINAL_URL="https://${RAILWAY_DOMAIN}"
          echo "railway_api_url=${FINAL_URL}" >> "$GITHUB_OUTPUT"

          # Post a commit status so the API URL appears on the PR checks tab
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d "$(jq -n \
              --arg url "${FINAL_URL}/healthz" \
              '{"state":"success","target_url":$url,"description":"Railway preview API","context":"railway/preview-api"}')" \
            || echo "::warning::Failed to post commit status (non-fatal)"

      # 4. Link the CLI to the preview branch so repo migrations can be applied there.
      - name: Link Supabase preview branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "${{ steps.supabase-branch.outputs.branch_ref }}"

      # 5. Ensure preview branches receive repo migrations added in the PR.
      - name: Apply preview branch migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push \
            --linked

      # 6. Configure Vercel preview env vars before we capture its preview URL for
      # branch-local Supabase function secrets.
      - name: Configure Vercel preview env vars
        id: vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.BRANCH_NAME }}"
          PROJECT_ID="${VERCEL_PROJECT_ID:-}"
          ORG_ID="${VERCEL_ORG_ID:-}"
          TEAM_AMP=""
          TEAM_Q=""

          fail_vercel_config() { echo "::error::$1"; exit 1; }

          [[ -z "$PROJECT_ID" ]] && fail_vercel_config "Missing VERCEL_PROJECT_ID."
          [[ -z "$ORG_ID" ]] && fail_vercel_config "Missing VERCEL_ORG_ID."

          case "$ORG_ID" in
            team_*) TEAM_AMP="&teamId=${ORG_ID}"; TEAM_Q="?teamId=${ORG_ID}" ;;
            user_*) ;;
            *) fail_vercel_config "VERCEL_ORG_ID must start with team_ or user_." ;;
          esac

          PROJECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}${TEAM_Q}")
          if [[ "$PROJECT_STATUS" != "200" ]]; then
            fail_vercel_config "Vercel project preflight failed (HTTP ${PROJECT_STATUS})."
          fi

          set_vercel_env() {
            local KEY="$1" VALUE="$2"
            EXISTING_ID=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?gitBranch=${BRANCH}${TEAM_AMP}" \
              | jq -r --arg k "$KEY" '.envs[] | select(.key==$k) | .id' 2>/dev/null || echo "")
            if [[ -n "$EXISTING_ID" ]]; then
              curl -sf -X DELETE \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v10/projects/${PROJECT_ID}/env/${EXISTING_ID}${TEAM_Q}" > /dev/null
            fi
            POST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env${TEAM_Q}" \
              -d "$(jq -n --arg k "$KEY" --arg v "$VALUE" --arg b "$BRANCH" \
                '{"key":$k,"value":$v,"target":["preview"],"gitBranch":$b,"type":"encrypted"}')")
            if [[ ! "$POST_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Vercel env write failed for $KEY (HTTP $POST_STATUS)"
              exit 1
            fi
          }

          set_vercel_env "API_URL" "${{ steps.railway.outputs.railway_api_url }}"
          set_vercel_env "NEXT_PUBLIC_API_URL" "${{ steps.railway.outputs.railway_api_url }}"
          set_vercel_env "EXPO_PUBLIC_API_URL" "${{ steps.railway.outputs.railway_api_url }}"
          set_vercel_env "NEXT_PUBLIC_APP_ENV" "preview"
          set_vercel_env "INTERNAL_EVENTS_TOKEN_API" "${{ secrets.INTERNAL_EVENTS_TOKEN_API || secrets.INTERNAL_EVENTS_TOKEN || secrets.INTERNAL_ACTIVITY_WORKER_TOKEN }}"
          set_vercel_env "INTERNAL_REMINDERS_TOKEN_API" "${{ secrets.INTERNAL_REMINDERS_TOKEN }}"
          set_vercel_env "INTERNAL_ACTIVITY_WORKER_TOKEN_API" "${{ secrets.INTERNAL_ACTIVITY_WORKER_TOKEN }}"
          set_vercel_env "INTERNAL_ACTIVITY_PROJECTOR_TOKEN" "${{ secrets.INTERNAL_ACTIVITY_PROJECTOR_TOKEN || secrets.INTERNAL_ACTIVITY_FEED_TOKEN }}"

          LATEST_DEPLOYMENT_JSON=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&target=preview&limit=1&meta-githubCommitRef=${BRANCH}${TEAM_AMP}" \
          )
          LATEST_DEPLOYMENT_ID=$(echo "$LATEST_DEPLOYMENT_JSON" | jq -r '.deployments[0].uid // ""')
          LATEST_DEPLOYMENT_URL=$(echo "$LATEST_DEPLOYMENT_JSON" | jq -r '.deployments[0].url // ""')

          if [[ -n "$LATEST_DEPLOYMENT_ID" ]]; then
            REDEPLOY_URL=$(curl -sf -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v13/deployments${TEAM_Q}" \
              -d "$(jq -n --arg deploymentId "$LATEST_DEPLOYMENT_ID" \
                '{"deploymentId":$deploymentId,"target":"preview","withLatestCommit":true}')" \
              | jq -r '.url // ""')
          else
            REDEPLOY_URL=""
          fi

          if [[ -n "$REDEPLOY_URL" ]]; then
            echo "vercel_url=https://${REDEPLOY_URL}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$LATEST_DEPLOYMENT_URL" ]]; then
            echo "vercel_url=https://${LATEST_DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_url=https://vercel.com/dashboard" >> "$GITHUB_OUTPUT"
          fi

      # 7. Set branch-specific Edge Function secrets so preview functions talk to preview services.
      - name: Configure Supabase preview function secrets
        env:
          BRANCH_API_URL: ${{ steps.branch-creds.outputs.branch_api_url }}
          BRANCH_PROJECT_REF: ${{ steps.supabase-branch.outputs.branch_ref }}
          INTERNAL_ACTIVITY_PROJECTOR_TOKEN: ${{ secrets.INTERNAL_ACTIVITY_PROJECTOR_TOKEN || secrets.INTERNAL_ACTIVITY_FEED_TOKEN }}
          INTERNAL_ACTIVITY_WORKER_TOKEN: ${{ secrets.INTERNAL_ACTIVITY_WORKER_TOKEN }}
          INTERNAL_EVENTS_TOKEN: ${{ secrets.INTERNAL_EVENTS_TOKEN_API || secrets.INTERNAL_EVENTS_TOKEN || secrets.INTERNAL_ACTIVITY_WORKER_TOKEN }}
          INTERNAL_REMINDERS_TOKEN: ${{ secrets.INTERNAL_REMINDERS_TOKEN }}
          RAILWAY_API_URL: ${{ steps.railway.outputs.railway_api_url }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.branch-creds.outputs.service_role_key }}
        run: |
          set -euo pipefail

          if [[ -z "${RAILWAY_API_URL:-}" || "${RAILWAY_API_URL}" == "pending" ]]; then
            echo "::error::Railway preview API URL is unavailable, cannot configure Supabase function secrets."
            exit 1
          fi
          if [[ -z "${INTERNAL_EVENTS_TOKEN:-}" ]]; then
            echo "::error::Missing INTERNAL_EVENTS_TOKEN_API/INTERNAL_EVENTS_TOKEN GitHub secret. events-dispatch cannot authenticate to apps/api."
            exit 1
          fi
          if [[ -z "${INTERNAL_REMINDERS_TOKEN:-}" ]]; then
            echo "::error::Missing INTERNAL_REMINDERS_TOKEN GitHub secret. reminders-dispatch cannot authenticate to apps/api."
            exit 1
          fi

          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT

          cat <<EOF > "$ENV_FILE"
          SUPABASE_URL=${BRANCH_API_URL}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          EVENTS_DISPATCH_URL=${RAILWAY_API_URL}/internal/events/dispatch
          REMINDERS_DISPATCH_URL=${RAILWAY_API_URL}/internal/reminders/dispatch
          ACTIVITY_WORKER_DISPATCH_URL=${RAILWAY_API_URL}/internal/activity-worker/dispatch
          ACTIVITY_PROJECTOR_DISPATCH_URL=${RAILWAY_API_URL}/internal/activity-feed/project
          INTERNAL_EVENTS_TOKEN=${INTERNAL_EVENTS_TOKEN}
          INTERNAL_REMINDERS_TOKEN=${INTERNAL_REMINDERS_TOKEN}
          INTERNAL_ACTIVITY_WORKER_TOKEN=${INTERNAL_ACTIVITY_WORKER_TOKEN}
          INTERNAL_ACTIVITY_PROJECTOR_TOKEN=${INTERNAL_ACTIVITY_PROJECTOR_TOKEN}
          EOF

          supabase secrets set \
            --project-ref "${BRANCH_PROJECT_REF}" \
            --env-file "$ENV_FILE"

      # 8. Deploy preview branch Edge Functions after secrets are in place.
      - name: Deploy Supabase preview Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy \
            --project-ref "${{ steps.supabase-branch.outputs.branch_ref }}" \
            --use-api \
            --jobs 4

      # 9. Create or refresh branch-local cron jobs with the preview branch URL.
      - name: Configure Supabase preview cron jobs
        env:
          ADMIN_DATABASE_URL: ${{ steps.branch-creds.outputs.admin_database_url }}
          BRANCH_API_URL: ${{ steps.branch-creds.outputs.branch_api_url }}
        run: |
          set -euo pipefail

          PGSSLMODE=require psql "${ADMIN_DATABASE_URL}" \
            -v ON_ERROR_STOP=1 \
            -c "select public.configure_edge_function_cron('${BRANCH_API_URL}');"

          PGSSLMODE=require psql "${ADMIN_DATABASE_URL}" \
            -v ON_ERROR_STOP=1 \
            -c "select jobname, schedule from cron.job where jobname like 'edge-function-%' order by jobname;"

          PGSSLMODE=require psql "${ADMIN_DATABASE_URL}" \
            -v ON_ERROR_STOP=1 \
            -c "do \$\$ begin
              if not exists (select 1 from cron.job where jobname = 'edge-function-events-dispatch') then
                raise exception 'missing edge-function-events-dispatch cron job';
              end if;
              if not exists (select 1 from cron.job where jobname = 'edge-function-reminders-dispatch') then
                raise exception 'missing edge-function-reminders-dispatch cron job';
              end if;
              if not exists (select 1 from cron.job where jobname = 'edge-function-channel-read-state-repair') then
                raise exception 'missing edge-function-channel-read-state-repair cron job';
              end if;
              if exists (
                select 1
                from cron.job
                where jobname in (
                  'edge-function-notifications-dispatch',
                  'edge-function-reminders-reconcile-dispatch',
                  'edge-function-activity-worker-dispatch',
                  'edge-function-activity-projector-dispatch'
                )
              ) then
                raise exception 'deprecated split dispatcher cron jobs are still scheduled';
              end if;
            end \$\$;"

      # 10. Post / update the single unified PR comment
      - name: Post preview environment comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber  = context.payload.pull_request.number;
            const webUrl    = '${{ steps.vercel.outputs.vercel_url }}';
            const apiUrl    = '${{ steps.railway.outputs.railway_api_url }}';
            const branchRef = '${{ steps.supabase-branch.outputs.branch_ref }}';
            const studioUrl = `https://supabase.com/dashboard/project/${branchRef}`;

            // ── Helpers ────────────────────────────────────────────────────────
            const fmt = (bytes) => {
              if (bytes == null) return '—';
              if (bytes < 1024) return `${bytes} B`;
              if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} kB`;
              return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
            };
            const sizeDelta = (pr, base) => {
              if (pr == null || base == null) return '';
              const d = pr - base;
              if (d === 0) return ' *(no change)*';
              return ` *(${d > 0 ? '+' : ''}${fmt(d)})*`;
            };

            // ── Bundle sizes ───────────────────────────────────────────────────
            let bundleSection = '\n\n> ⚠️ Bundle sizes unavailable — the bundle-size job may have timed out or failed.';
            const bundlePath = '/tmp/artifacts/bundle-sizes.json';
            if (fs.existsSync(bundlePath)) {
              try {
                const { pr, base } = JSON.parse(fs.readFileSync(bundlePath, 'utf8'));
                const rows = [
                  ['Web JS',    pr.web?.js?.gz,    base.web?.js?.gz,    pr.web?.js?.count],
                  ['Web CSS',   pr.web?.css?.gz,   base.web?.css?.gz,   pr.web?.css?.count],
                  ['Mobile JS', pr.mobile?.js?.gz, base.mobile?.js?.gz, pr.mobile?.js?.count],
                  ['API JS',    pr.api?.js?.gz,    base.api?.js?.gz,    pr.api?.js?.count],
                ];
                bundleSection = [
                  '',
                  '### Bundle Sizes (gzip)',
                  '',
                  '| App | This PR | Base branch | Files |',
                  '|-----|---------|-------------|-------|',
                  ...rows.map(([label, prGz, baseGz, count]) =>
                    `| ${label} | ${fmt(prGz)}${sizeDelta(prGz, baseGz)} | ${fmt(baseGz)} | ${count ?? '—'} |`
                  ),
                ].join('\n');
              } catch (e) {
                bundleSection = `\n\n> ⚠️ Bundle size data could not be parsed: ${e.message}`;
              }
            }

            const easPreviewWorkflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/eas-preview-build.yml`;
            const localNativeBuildWorkflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/native-preview-build.yml`;

            // ── Assemble comment ───────────────────────────────────────────────
            const body = [
              '## Preview Environment Ready',
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| Web (Vercel) | ${webUrl} |`,
              `| API (Railway) | ${apiUrl}/healthz |`,
              `| Supabase Studio | ${studioUrl} |`,
              '',
              `**Mobile build** — [Actions → EAS Preview Build](${easPreviewWorkflowUrl}) → PR number: \`${prNumber}\``,
              `**Local native build** — [Actions → Create Local Native Build](${localNativeBuildWorkflowUrl}) → PR number: \`${prNumber}\``,
              bundleSection,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Environment Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ──────────────────────────────────────────────────────────────
  # Job 6: Cleanup — runs only when a PR is closed (merged or not)
  # Deletes the Supabase preview branch, Railway environment, and
  # Vercel branch-scoped env vars for this PR.
  # ──────────────────────────────────────────────────────────────
  cleanup:
    name: Clean Up Preview Environemnts
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH_NAME: ${{ github.head_ref }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── 1. Delete Supabase preview branch ──────────────────────
      - name: Delete Supabase branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          BRANCH_ID=$(supabase branches list \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --output json \
            | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name==$name) | .id // ""')

          if [[ -n "$BRANCH_ID" ]]; then
            supabase branches delete "$BRANCH_ID" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
            echo "Deleted Supabase branch: $BRANCH_NAME ($BRANCH_ID)"
          else
            echo "No Supabase branch found for $BRANCH_NAME — skipping"
          fi

      # ── 2. Delete Railway preview environment ──────────────────
      - name: Delete Railway environment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "::error::PR_NUMBER is empty; cannot derive Railway preview environment name"
            exit 1
          fi
          ENV_NAME="${{ github.event.repository.name }}-pr-${PR_NUMBER}"
          GQL="https://backboard.railway.app/graphql/v2"

          # Ref: https://docs.railway.com/integrations/api/manage-environments
          ENV_ID=$(curl -sf \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" "$GQL" \
            -d "$(jq -n --arg pid "${{ secrets.RAILWAY_PROJECT_ID }}" \
              '{query:"query environments($projectId: String!) { environments(projectId: $projectId) { edges { node { id name } } } }", variables:{projectId:$pid}}')" \
            | jq -r --arg name "$ENV_NAME" '.data.environments.edges[]? | select(.node.name==$name) | .node.id // empty')

          if [[ -n "$ENV_ID" ]]; then
            curl -sf \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" "$GQL" \
              -d "$(jq -n --arg eid "$ENV_ID" \
                '{query:"mutation environmentDelete($id: String!) { environmentDelete(id: $id) }", variables:{id:$eid}}')"
            echo "Deleted Railway environment: $ENV_NAME ($ENV_ID)"
          else
            echo "No Railway environment found for $ENV_NAME — skipping"
          fi

      # ── 3. Remove Vercel branch-scoped env vars ─────────────────
      - name: Remove Vercel branch env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.BRANCH_NAME }}"
          PROJECT_ID="${VERCEL_PROJECT_ID:-}"
          ORG_ID="${VERCEL_ORG_ID:-}"
          TEAM_AMP=""
          TEAM_Q=""

          fail_vercel_config() { echo "::error::$1"; exit 1; }

          [[ -z "$PROJECT_ID" ]] && fail_vercel_config "Missing VERCEL_PROJECT_ID."
          [[ -z "$ORG_ID" ]] && fail_vercel_config "Missing VERCEL_ORG_ID."

          case "$ORG_ID" in
            team_*) TEAM_AMP="&teamId=${ORG_ID}"; TEAM_Q="?teamId=${ORG_ID}" ;;
            user_*) ;;
            *) fail_vercel_config "VERCEL_ORG_ID must start with team_ or user_." ;;
          esac

          PROJECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}${TEAM_Q}")
          if [[ "$PROJECT_STATUS" != "200" ]]; then
            fail_vercel_config "Vercel project preflight failed (HTTP ${PROJECT_STATUS})."
          fi

          ENV_IDS=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?gitBranch=${BRANCH}${TEAM_AMP}" \
            | jq -r '.envs[].id' 2>/dev/null || echo "")

          if [[ -n "$ENV_IDS" ]]; then
            while IFS= read -r ENV_ID; do
              curl -sf -X DELETE \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v10/projects/${PROJECT_ID}/env/${ENV_ID}${TEAM_Q}" > /dev/null \
                && echo "Deleted Vercel env var: $ENV_ID"
            done <<< "$ENV_IDS"
          else
            echo "No Vercel branch env vars found for $BRANCH — skipping"
          fi

      # ── 4. Post cleanup comment ─────────────────────────────────
      - name: Post cleanup comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🧹 Preview environment cleaned up (Supabase branch, Railway environment, and Vercel env vars removed).',
            });
