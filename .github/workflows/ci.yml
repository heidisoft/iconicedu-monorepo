name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Format · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Turborepo's local task output cache between runs.
      # The cache key includes the commit hash so it always writes a new entry,
      # but restores from the most recent matching prefix on cache miss.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Generate Prisma client from schema — required before API typecheck.
      # Does not connect to a real database; it only reads prisma/schema.prisma.
      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      # Build shared packages first so apps can resolve workspace imports.
      # Turborepo handles the correct build order automatically.
      - name: Build shared packages
        run: pnpm build:packages

      - name: Format check
        run: pnpm format:check:changed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          CI: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/web/coverage/
            apps/mobile/coverage/
            packages/ui-web/coverage/
            packages/ui-native/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build apps
        run: pnpm build
        env:
          # Required for Next.js build — use placeholder values in CI since
          # this is a build check, not a deployment.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
