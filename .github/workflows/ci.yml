name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Code quality — format · lint · typecheck
  # PRs: affected packages only (fast feedback)
  # ──────────────────────────────────────────────────────────────
  quality:
    # Branch protection depends on this exact job name.
    # If you rename it, update .github/branch-protection/main.json and
    # scripts/github/apply-branch-protection.sh in the same change.
    name: Quality (format · lint · typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch enough history for turbo --affected to compare against the base
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-

      # Generate Prisma client from schema — required before API typecheck.
      # Does not connect to a real database; it only reads prisma/schema.prisma.
      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      # Build shared packages so apps can resolve workspace imports.
      - name: Build shared packages
        run: pnpm build:packages

      # Always check all files — prettier is fast enough to run unconditionally.
      - name: Format check
        run: pnpm format:check

      # Temporarily disabled in GitHub Actions. Keep the local script in package.json
      # so the guard can be re-enabled here without reintroducing the implementation.
      # - name: Guard feature flags
      #   run: pnpm guard:feature-flags

      # PRs: only affected packages.
      - name: Lint + Typecheck
        run: pnpm exec turbo run lint typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # ──────────────────────────────────────────────────────────────
  # Job 2: Tests + coverage
  # PRs: affected packages only. Push to main: all packages.
  # ──────────────────────────────────────────────────────────────
  test:
    # Branch protection depends on this exact job name.
    # If you rename it, update .github/branch-protection/main.json and
    # scripts/github/apply-branch-protection.sh in the same change.
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-

      - name: Build shared packages
        run: pnpm build:packages

      # Generate Prisma client — required for API test suite.
      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      # PRs: only affected packages. Push to main: all packages.
      - name: Test
        run: pnpm exec turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          CI: true
          VITEST_COVERAGE: true
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/web/coverage/
            apps/api/coverage/
            apps/mobile/coverage/
            packages/ui-web/coverage/
            packages/ui-native/coverage/
            packages/shared-types/coverage/
            packages/utils/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # Job 3a: Web bundle size — runs parallel to quality + test
  # preactjs/compressed-size-action checks out both the base branch
  # and the PR branch, builds each, and posts a PR comment with
  # per-file gzip size deltas. Informational only — not a gate.
  # ──────────────────────────────────────────────────────────────
  bundle-size-web:
    name: Bundle Size (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Analyze web bundle size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          install-script: pnpm install --frozen-lockfile
          build-script: ci:bundle:web
          pattern: |
            apps/web/.next/static/**/*.js
            apps/web/.next/static/**/*.css
          exclude: "**/*.map"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          TURBO_TELEMETRY_DISABLED: 1

  # ──────────────────────────────────────────────────────────────
  # Job 3b: Mobile bundle size — runs parallel to quality + test
  # Uses expo export --platform android to produce the React Native
  # JS bundle (no native compilation needed on Linux), then posts a
  # PR comment with the gzip size delta vs the base branch.
  # Informational only — not a gate.
  # ──────────────────────────────────────────────────────────────
  bundle-size-mobile:
    name: Bundle Size (Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Analyze mobile bundle size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          install-script: pnpm install --frozen-lockfile
          build-script: ci:bundle:mobile
          pattern: apps/mobile/.expo/dist/_expo/static/js/**/*.js
          exclude: "**/*.map"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          EXPO_NO_TELEMETRY: 1
          TURBO_TELEMETRY_DISABLED: 1

  # ──────────────────────────────────────────────────────────────
  # Job 4: Build apps — only runs after quality + test both pass
  # ──────────────────────────────────────────────────────────────
  build:
    # Branch protection depends on this exact job name.
    # If you rename it, update .github/branch-protection/main.json and
    # scripts/github/apply-branch-protection.sh in the same change.
    name: Build
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      # Set build env vars — use repo secrets when available, fall back to
      # placeholder values so the Next.js build succeeds in forks / fresh repos.
      - name: Set build env vars
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${_ANON:-placeholder-anon-key}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${_SRK:-placeholder-service-role-key}" >> "$GITHUB_ENV"
        env:
          _URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          _ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          _SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build all
        run: pnpm build
