name: 'Create EAS Build'

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'ios'
          - 'android'
      profile:
        description: 'EAS profile to build'
        required: true
        type: choice
        default: 'preview'
        options:
          - 'development'
          - 'preview'
          - 'production'
      pr_number:
        description: 'PR number to comment on when building a non-main branch'
        required: false
        type: string

jobs:
  eas-build:
    name: 'Create EAS Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Resolve build context
        id: context
        run: |
          set -euo pipefail

          BRANCH_NAME="${GITHUB_REF_NAME}"
          BUILD_PROFILE="${{ github.event.inputs.profile }}"
          PR_NUMBER_INPUT="${{ github.event.inputs.pr_number }}"

          if [[ "$BRANCH_NAME" != "main" && -z "$PR_NUMBER_INPUT" ]]; then
            echo "::error::PR number is required when building a branch other than main."
            exit 1
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "build_profile=$BUILD_PROFILE" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

          if [[ "$BUILD_PROFILE" == "production" ]]; then
            echo "build_kind=production" >> "$GITHUB_OUTPUT"
          else
            echo "build_kind=preview" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$PR_NUMBER_INPUT" ]]; then
            echo "Using PR #$PR_NUMBER_INPUT for branch '$BRANCH_NAME'."
            echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.context.outputs.should_build == 'true'
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        if: steps.context.outputs.should_build == 'true'
        with:
          node-version: '20.19.0'

      - uses: pnpm/action-setup@v4
        if: steps.context.outputs.should_build == 'true'
        with:
          version: '10.33.0'

      - name: Install dependencies
        if: steps.context.outputs.should_build == 'true'
        run: pnpm install

      - uses: supabase/setup-cli@v1
        if: steps.context.outputs.should_build == 'true'
        with:
          version: latest

      # 1. Fetch Supabase credentials for the selected build target
      - name: Fetch Supabase credentials
        id: supabase-creds
        if: steps.context.outputs.should_build == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ steps.context.outputs.build_kind }}" == "preview" ]]; then
            BRANCH_NAME="${{ steps.context.outputs.branch_name }}"
            echo "Looking for Supabase branch: $BRANCH_NAME"

            BRANCH_DATA=$(supabase branches list \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --output json \
              | jq --arg name "$BRANCH_NAME" '.[] | select(.name==$name)')

            if [[ -z "$BRANCH_DATA" ]]; then
              echo "::error::No Supabase branch found for '$BRANCH_NAME'. Make sure the PR is open and the preview-env workflow has completed."
              exit 1
            fi

            PROJECT_REF=$(echo "$BRANCH_DATA" | jq -r '.project_ref // .ref // ""')
            if [[ -z "$PROJECT_REF" || "$PROJECT_REF" == "null" ]]; then
              echo "::error::Supabase branch '$BRANCH_NAME' is missing project_ref in branches list output."
              exit 1
            fi
          else
            PROJECT_REF="${{ secrets.SUPABASE_PROJECT_ID }}"
            if [[ -z "$PROJECT_REF" || "$PROJECT_REF" == "null" ]]; then
              echo "::error::SUPABASE_PROJECT_ID is not configured."
              exit 1
            fi
            echo "Using default production Supabase project ref from SUPABASE_PROJECT_ID."
          fi

          echo "Resolved project ref: $PROJECT_REF"

          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
            | jq -r '.[] | select(.name=="anon") | .api_key')
          if [[ -z "$ANON_KEY" || "$ANON_KEY" == "null" ]]; then
            echo "::error::Could not resolve anon API key for Supabase project ref '$PROJECT_REF'."
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"

          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "api_url=https://${PROJECT_REF}.supabase.co" >> "$GITHUB_OUTPUT"

      # 2. Fetch Railway preview API URL — disabled until Railway is configured
      # - name: Fetch Railway preview API URL
      #   id: railway
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      #   run: |
      #     npm install -g @railway/cli --silent
      #     ENV_NAME="pr-${{ github.event.inputs.pr_number }}"
      #     RAILWAY_DOMAIN=$(railway domain \
      #       --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
      #       --environment "$ENV_NAME" \
      #       --project "${{ secrets.RAILWAY_PROJECT_ID }}" 2>/dev/null || echo "")
      #     if [[ -n "$RAILWAY_DOMAIN" ]]; then
      #       echo "railway_api_url=https://${RAILWAY_DOMAIN}" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "::warning::Could not fetch Railway API URL for $ENV_NAME"
      #       echo "railway_api_url=" >> "$GITHUB_OUTPUT"
      #     fi

      # 3. Trigger EAS build
      - name: Trigger EAS build
        id: eas-build
        if: steps.context.outputs.should_build == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g eas-cli --silent

          cd apps/mobile

          tmp_eas_json=$(mktemp)
          jq \
            --arg profile "${{ steps.context.outputs.build_profile }}" \
            --arg app_env "${{ steps.context.outputs.build_profile }}" \
            --arg supabase_url "${{ steps.supabase-creds.outputs.api_url }}" \
            --arg anon_key "${{ steps.supabase-creds.outputs.anon_key }}" \
            --arg posthog_key "${{ secrets.POSTHOG_KEY }}" \
            --arg posthog_host "${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" \
            '.build[$profile].env = ((.build[$profile].env // {}) + {
              EXPO_PUBLIC_SUPABASE_URL: $supabase_url,
              EXPO_PUBLIC_SUPABASE_ANON_KEY: $anon_key,
              EXPO_PUBLIC_APP_ENV: $app_env,
              EXPO_PUBLIC_POSTHOG_KEY: $posthog_key,
              EXPO_PUBLIC_POSTHOG_HOST: $posthog_host
            })' \
            eas.json > "$tmp_eas_json"
          mv "$tmp_eas_json" eas.json

          if ! BUILD_OUTPUT=$(eas build \
            --profile "${{ steps.context.outputs.build_profile }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --non-interactive \
            --no-wait \
            2>&1); then
            echo "$BUILD_OUTPUT"
            exit 1
          fi

          echo "$BUILD_OUTPUT"

          # Extract build URL from output
          BUILD_URL=$(echo "$BUILD_OUTPUT" | grep -oP 'https://expo\.dev/accounts/[^\s]+' | head -1 || echo "")
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      # 4. Post comment on PR
      - name: Post build comment on PR
        if: steps.context.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.context.outputs.pr_number }}');
            const branch = '${{ steps.context.outputs.branch_name }}';
            const platform = '${{ github.event.inputs.platform }}';
            const profile = '${{ steps.context.outputs.build_profile }}';
            const buildUrl = '${{ steps.eas-build.outputs.build_url }}';
            const supabaseUrl = '${{ steps.supabase-creds.outputs.api_url }}';

            const platformLabel =
              platform === 'all'
                ? 'iOS + Android'
                : platform.charAt(0).toUpperCase() + platform.slice(1);
            const profileLabel = profile.charAt(0).toUpperCase() + profile.slice(1);
            const buildLink = buildUrl ? `[Track build](${buildUrl})` : 'Check your [Expo dashboard](https://expo.dev)';

            const body = [
              '### EAS Build Triggered',
              '',
              `**Branch:** \`${branch}\``,
              `**Platform:** ${platformLabel}`,
              `**Profile:** ${profileLabel}`,
              `**Supabase URL:** \`${supabaseUrl}\``,
              '',
              `${buildLink} - install via internal distribution once the build completes.`,
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  `Skipping PR comment for #${prNumber}: GitHub Actions token cannot write issue comments in this run context. ` +
                  'This commonly happens for restricted workflow tokens, forked contexts, or org policies that force read-only tokens.'
                );
                return;
              }

              throw error;
            }

      - name: Report skipped build
        if: steps.context.outputs.should_build != 'true'
        run: |
          echo "Skipped EAS build for branch '${{ steps.context.outputs.branch_name }}' because there is no open PR to main."
