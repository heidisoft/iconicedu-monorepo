name: 'Create EAS Build'

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'ios'
          - 'android'
      profile:
        description: 'EAS profile to build'
        required: true
        type: choice
        default: 'preview'
        options:
          - 'development'
          - 'preview'
          - 'production'
      pr_number:
        description: 'PR number to comment on when building a non-main branch'
        required: false
        type: string

jobs:
  eas-build:
    name: 'Create EAS Build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Resolve build context
        id: context
        run: |
          set -euo pipefail

          BRANCH_NAME="${GITHUB_REF_NAME}"
          BUILD_PROFILE="${{ github.event.inputs.profile }}"
          PR_NUMBER_INPUT="${{ github.event.inputs.pr_number }}"

          if [[ "$BRANCH_NAME" != "main" && -z "$PR_NUMBER_INPUT" ]]; then
            echo "::error::PR number is required when building a branch other than main."
            exit 1
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "build_profile=$BUILD_PROFILE" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

          if [[ "$BUILD_PROFILE" == "production" ]]; then
            echo "build_kind=production" >> "$GITHUB_OUTPUT"
          else
            echo "build_kind=preview" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$PR_NUMBER_INPUT" ]]; then
            echo "Using PR #$PR_NUMBER_INPUT for branch '$BRANCH_NAME'."
            echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.context.outputs.should_build == 'true'
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        if: steps.context.outputs.should_build == 'true'
        with:
          node-version: '20.19.0'

      - uses: pnpm/action-setup@v4
        if: steps.context.outputs.should_build == 'true'
        with:
          version: '10.33.0'

      - name: Install dependencies
        if: steps.context.outputs.should_build == 'true'
        run: pnpm install

      - uses: supabase/setup-cli@v1
        if: steps.context.outputs.should_build == 'true'
        with:
          version: latest

      - name: Install Railway and Vercel CLIs
        if: steps.context.outputs.should_build == 'true'
        run: npm install -g @railway/cli vercel --silent

      # 1. Fetch Supabase credentials for the selected build target
      - name: Fetch Supabase credentials
        id: supabase-creds
        if: steps.context.outputs.should_build == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ steps.context.outputs.build_kind }}" == "preview" ]]; then
            BRANCH_NAME="${{ steps.context.outputs.branch_name }}"
            echo "Looking for Supabase branch: $BRANCH_NAME"

            BRANCH_DATA=$(supabase branches list \
              --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" \
              --output json \
              | jq --arg name "$BRANCH_NAME" '.[] | select(.name==$name)')

            if [[ -z "$BRANCH_DATA" ]]; then
              echo "::error::No Supabase branch found for '$BRANCH_NAME'. Make sure the PR is open and the preview-env workflow has completed."
              exit 1
            fi

            PROJECT_REF=$(echo "$BRANCH_DATA" | jq -r '.project_ref // .ref // ""')
            if [[ -z "$PROJECT_REF" || "$PROJECT_REF" == "null" ]]; then
              echo "::error::Supabase branch '$BRANCH_NAME' is missing project_ref in branches list output."
              exit 1
            fi
          else
            PROJECT_REF="${{ vars.SUPABASE_PROJECT_ID }}"
            if [[ -z "$PROJECT_REF" || "$PROJECT_REF" == "null" ]]; then
              echo "::error::SUPABASE_PROJECT_ID is not configured."
              exit 1
            fi
            echo "Using default production Supabase project ref from SUPABASE_PROJECT_ID."
          fi

          echo "Resolved project ref: $PROJECT_REF"

          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
            | jq -r '.[] | select(.name=="anon") | .api_key')
          if [[ -z "$ANON_KEY" || "$ANON_KEY" == "null" ]]; then
            echo "::error::Could not resolve anon API key for Supabase project ref '$PROJECT_REF'."
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"

          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "api_url=https://${PROJECT_REF}.supabase.co" >> "$GITHUB_OUTPUT"

      - name: Resolve app URLs from Railway and Vercel
        id: app-urls
        if: steps.context.outputs.should_build == 'true'
        env:
          BUILD_KIND: ${{ steps.context.outputs.build_kind }}
          BRANCH_NAME: ${{ steps.context.outputs.branch_name }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          CONFIGURED_API_URL: ${{ vars.API_URL || secrets.API_URL }}
          CONFIGURED_WEB_URL: ${{ vars.WEB_URL || secrets.WEB_URL }}
        run: |
          set -euo pipefail

          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_BRANCH="${BRANCH_NAME}"
          RAILWAY_SERVICE_NAME="${REPO_NAME}"
          USE_PRODUCTION_URLS=false

          if [[ "${BUILD_KIND}" == "production" || "${TARGET_BRANCH}" == "main" ]]; then
            RAILWAY_ENVIRONMENT="production"
            USE_PRODUCTION_URLS=true
          else
            if [[ -z "${PR_NUMBER:-}" ]]; then
              echo "::error::PR number is required to resolve preview Railway and Vercel URLs for branch '${TARGET_BRANCH}'."
              exit 1
            fi
            RAILWAY_ENVIRONMENT="${REPO_NAME}-pr-${PR_NUMBER}"
          fi

          normalize_url() {
            local url="$1"
            if [[ -z "${url}" ]]; then
              return 0
            fi
            url="${url%/}"
            if [[ "${url}" != http://* && "${url}" != https://* ]]; then
              url="https://${url}"
            fi
            echo "${url}"
          }

          API_URL=$(normalize_url "${CONFIGURED_API_URL:-}")
          RAILWAY_GQL="https://backboard.railway.app/graphql/v2"

          wait_for_preview_api() {
            local health_url="${API_URL%/}/healthz"
            echo "Waiting for preview API readiness at ${health_url}."

            for attempt in {1..30}; do
              if curl -fsS --max-time 10 "${health_url}" >/dev/null; then
                echo "Preview API is ready."
                return 0
              fi

              echo "Preview API is not ready yet (${attempt}/30)."
              sleep 10
            done

            echo "::error::Preview API did not become ready at ${health_url}."
            return 1
          }

          railway_api() {
            local body="$1"
            local resp
            resp=$(curl -sf \
              -H "Authorization: Bearer ${RAILWAY_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${RAILWAY_GQL}" \
              -d "${body}") || {
              echo "::error::Railway API HTTP request failed."
              exit 1
            }
            local errs
            errs=$(echo "${resp}" | jq -r 'if .errors then .errors | map(.message) | join(", ") else empty end')
            if [[ -n "${errs}" ]]; then
              echo "::error::Railway GQL error: ${errs}"
              exit 1
            fi
            echo "${resp}"
          }

          if [[ -n "${API_URL}" && "${USE_PRODUCTION_URLS}" == "true" ]]; then
            echo "Using configured production API_URL."
          else
            ENV_RESP=$(railway_api "$(jq -n --arg pid "${RAILWAY_PROJECT_ID}" \
              '{query:"query environments($projectId: String!) { environments(projectId: $projectId) { edges { node { id name } } } }", variables:{projectId:$pid}}')")
            ENV_ID=$(echo "${ENV_RESP}" | jq -r --arg name "${RAILWAY_ENVIRONMENT}" \
              '.data.environments.edges[]? | select(.node.name==$name) | .node.id // empty')

            if [[ -z "${ENV_ID}" ]]; then
              echo "::error::Railway environment '${RAILWAY_ENVIRONMENT}' not found."
              exit 1
            fi

            PROJECT_RESP=$(railway_api "$(jq -n --arg pid "${RAILWAY_PROJECT_ID}" \
              '{query:"query project($id: String!) { project(id: $id) { services { edges { node { id name } } } } }", variables:{id:$pid}}')")
            SERVICE_ID=$(echo "${PROJECT_RESP}" | jq -r --arg name "${RAILWAY_SERVICE_NAME}" \
              '.data.project.services.edges[]? | select(.node.name==$name) | .node.id // empty')

            if [[ -z "${SERVICE_ID}" ]]; then
              echo "::error::Railway service '${RAILWAY_SERVICE_NAME}' not found in project."
              exit 1
            fi

            DOMAIN_RESP=$(railway_api "$(jq -n \
              --arg pid "${RAILWAY_PROJECT_ID}" \
              --arg eid "${ENV_ID}" \
              --arg sid "${SERVICE_ID}" \
              '{query:"query domains($projectId: String!, $environmentId: String!, $serviceId: String!) { domains(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) { serviceDomains { domain } customDomains { domain } } }", variables:{projectId:$pid, environmentId:$eid, serviceId:$sid}}')")
            API_HOST=$(echo "${DOMAIN_RESP}" | jq -r '
              [
                .data.domains.serviceDomains[]?.domain,
                .data.domains.customDomains[]?.domain
              ]
              | map(select(type == "string" and length > 0))
              | .[0] // empty')

            if [[ -z "${API_HOST}" ]]; then
              echo "::error::Unable to resolve a Railway URL for environment '${RAILWAY_ENVIRONMENT}' and service '${RAILWAY_SERVICE_NAME}'."
              exit 1
            fi

            API_URL="https://${API_HOST}"
          fi

          if [[ "${USE_PRODUCTION_URLS}" != "true" ]]; then
            wait_for_preview_api
          fi

          if [[ "${USE_PRODUCTION_URLS}" == "true" ]]; then
            VERCEL_TARGET="production"
            VERCEL_COMMIT_REF="main"
          else
            VERCEL_TARGET="preview"
            VERCEL_COMMIT_REF="${TARGET_BRANCH}"
          fi

          WEB_URL=$(normalize_url "${CONFIGURED_WEB_URL:-}")
          if [[ -n "${WEB_URL}" && "${USE_PRODUCTION_URLS}" == "true" ]]; then
            echo "Using configured production WEB_URL."
            echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
            echo "web_url=${WEB_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_ID="${VERCEL_PROJECT_ID:-}"
          ORG_ID="${VERCEL_ORG_ID:-}"
          TEAM_AMP=""
          TEAM_Q=""

          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::Missing VERCEL_PROJECT_ID."
            exit 1
          fi

          if [[ -z "${ORG_ID}" ]]; then
            echo "::error::Missing VERCEL_ORG_ID."
            exit 1
          fi

          case "${ORG_ID}" in
            team_*)
              TEAM_AMP="&teamId=${ORG_ID}"
              TEAM_Q="?teamId=${ORG_ID}"
              ;;
            user_*) ;;
            *)
              echo "::error::VERCEL_ORG_ID must start with team_ or user_."
              exit 1
              ;;
          esac

          PROJECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}${TEAM_Q}")
          if [[ "${PROJECT_STATUS}" != "200" ]]; then
            echo "::error::Vercel project preflight failed (HTTP ${PROJECT_STATUS})."
            exit 1
          fi

          WEB_URL=$(curl -sf \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&target=${VERCEL_TARGET}&limit=1&meta-githubCommitRef=${VERCEL_COMMIT_REF}${TEAM_AMP}" \
            | jq -r '.deployments[0].url // ""')

          if [[ -z "${WEB_URL}" ]]; then
            echo "::error::Unable to resolve a Vercel ${VERCEL_TARGET} deployment URL for branch '${VERCEL_COMMIT_REF}'."
            exit 1
          fi

          WEB_URL=$(normalize_url "${WEB_URL}")

          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "web_url=${WEB_URL}" >> "$GITHUB_OUTPUT"

      # 3. Trigger EAS build
      - name: Trigger EAS build
        id: eas-build
        if: steps.context.outputs.should_build == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g eas-cli --silent

          cd apps/mobile

          tmp_eas_json=$(mktemp)
          jq \
            --arg profile "${{ steps.context.outputs.build_profile }}" \
            --arg app_env "${{ steps.context.outputs.build_profile }}" \
            --arg supabase_url "${{ steps.supabase-creds.outputs.api_url }}" \
            --arg anon_key "${{ steps.supabase-creds.outputs.anon_key }}" \
            --arg posthog_key "${{ secrets.POSTHOG_KEY }}" \
            --arg posthog_host "${{ vars.POSTHOG_HOST || 'https://t.iconicedu.lk' }}" \
            --arg api_url "${{ steps.app-urls.outputs.api_url }}" \
            --arg web_url "${{ steps.app-urls.outputs.web_url }}" \
            '.build[$profile].env = ((.build[$profile].env // {}) + {
              EXPO_PUBLIC_SUPABASE_URL: $supabase_url,
              EXPO_PUBLIC_SUPABASE_ANON_KEY: $anon_key,
              EXPO_PUBLIC_APP_ENV: $app_env,
              EXPO_PUBLIC_POSTHOG_KEY: $posthog_key,
              EXPO_PUBLIC_POSTHOG_HOST: $posthog_host
            } + (if ($api_url | length) > 0 then {
              EXPO_PUBLIC_API_URL: $api_url
            } else {} end) + (if ($web_url | length) > 0 then {
              EXPO_PUBLIC_WEB_URL: $web_url
            } else {} end))' \
            eas.json > "$tmp_eas_json"
          mv "$tmp_eas_json" eas.json

          if ! BUILD_OUTPUT=$(eas build \
            --profile "${{ steps.context.outputs.build_profile }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --non-interactive \
            --no-wait \
            2>&1); then
            echo "$BUILD_OUTPUT"
            exit 1
          fi

          echo "$BUILD_OUTPUT"

          # Extract build URL from output
          BUILD_URL=$(echo "$BUILD_OUTPUT" | grep -oP 'https://expo\.dev/accounts/[^\s]+' | head -1 || echo "")
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      # 4. Post comment on PR
      - name: Post build comment on PR
        if: steps.context.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.context.outputs.pr_number }}');
            const branch = '${{ steps.context.outputs.branch_name }}';
            const platform = '${{ github.event.inputs.platform }}';
            const profile = '${{ steps.context.outputs.build_profile }}';
            const buildUrl = '${{ steps.eas-build.outputs.build_url }}';
            const supabaseUrl = '${{ steps.supabase-creds.outputs.api_url }}';
            const apiUrl = '${{ steps.app-urls.outputs.api_url }}';
            const webUrl = '${{ steps.app-urls.outputs.web_url }}';

            const platformLabel =
              platform === 'all'
                ? 'iOS + Android'
                : platform.charAt(0).toUpperCase() + platform.slice(1);
            const profileLabel = profile.charAt(0).toUpperCase() + profile.slice(1);
            const buildLink = buildUrl ? `[Track build](${buildUrl})` : 'Check your [Expo dashboard](https://expo.dev)';

            const body = [
              '### EAS Build Triggered',
              '',
              `**Branch:** \`${branch}\``,
              `**Platform:** ${platformLabel}`,
              `**Profile:** ${profileLabel}`,
              `**Supabase URL:** \`${supabaseUrl}\``,
              `**API URL:** \`${apiUrl}\``,
              `**Web URL:** \`${webUrl}\``,
              '',
              `${buildLink} - install via internal distribution once the build completes.`,
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  `Skipping PR comment for #${prNumber}: GitHub Actions token cannot write issue comments in this run context. ` +
                  'This commonly happens for restricted workflow tokens, forked contexts, or org policies that force read-only tokens.'
                );
                return;
              }

              throw error;
            }

      - name: Report skipped build
        if: steps.context.outputs.should_build != 'true'
        run: |
          echo "Skipped EAS build for branch '${{ steps.context.outputs.branch_name }}' because there is no open PR to main."
