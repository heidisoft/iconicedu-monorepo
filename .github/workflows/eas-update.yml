name: 'EAS Update'

on:
  workflow_dispatch:

jobs:
  eas-update:
    name: 'Publish OTA Update'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    concurrency:
      group: eas-update-production
      cancel-in-progress: false

    steps:
      - name: Require main for production OTA
        env:
          UPDATE_REF: ${{ github.ref }}
        run: |
          if [[ "${UPDATE_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production OTA updates must be published from main."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Install EAS CLI
        run: npm install -g eas-cli --silent

      - name: Resolve production Supabase credentials
        id: supabase-creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_PROJECT_ID}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is not configured."
            exit 1
          fi

          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys" \
            | jq -r '.[] | select(.name=="anon") | .api_key')

          if [[ -z "${ANON_KEY}" || "${ANON_KEY}" == "null" ]]; then
            echo "::error::Could not resolve anon API key for Supabase project ref '${SUPABASE_PROJECT_ID}'."
            exit 1
          fi

          echo "::add-mask::${ANON_KEY}"
          echo "api_url=https://${SUPABASE_PROJECT_ID}.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon_key=${ANON_KEY}" >> "$GITHUB_OUTPUT"

      - name: Resolve production app URLs
        id: app-urls
        env:
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
          WEB_URL: ${{ vars.WEB_URL || secrets.WEB_URL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node scripts/resolve-mobile-production-urls.mjs

      - name: Sync EAS production env
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_URL: ${{ steps.supabase-creds.outputs.api_url }}
          SUPABASE_ANON_KEY: ${{ steps.supabase-creds.outputs.anon_key }}
          API_URL: ${{ steps.app-urls.outputs.api_url }}
          WEB_URL: ${{ steps.app-urls.outputs.web_url }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://t.iconicedu.lk' }}
          TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail

          cd apps/mobile

          upsert_eas_env() {
            local name="$1"
            local value="$2"
            local visibility="$3"

            if [[ -z "${value}" ]]; then
              echo "::error::Missing value for ${name}."
              exit 1
            fi

            eas env:create production \
              --name "${name}" \
              --value "${value}" \
              --visibility "${visibility}" \
              --scope project \
              --force \
              --non-interactive
          }

          upsert_eas_env "EXPO_PUBLIC_SUPABASE_URL" "${SUPABASE_URL}" "plaintext"
          upsert_eas_env "EXPO_PUBLIC_SUPABASE_ANON_KEY" "${SUPABASE_ANON_KEY}" "sensitive"
          upsert_eas_env "EXPO_PUBLIC_API_URL" "${API_URL}" "plaintext"
          upsert_eas_env "EXPO_PUBLIC_WEB_URL" "${WEB_URL}" "plaintext"
          upsert_eas_env "EXPO_PUBLIC_APP_ENV" "production" "plaintext"
          upsert_eas_env "EXPO_PUBLIC_POSTHOG_HOST" "${POSTHOG_HOST}" "plaintext"

          if [[ -n "${POSTHOG_KEY}" ]]; then
            upsert_eas_env "EXPO_PUBLIC_POSTHOG_KEY" "${POSTHOG_KEY}" "sensitive"
          fi

          # Cloudflare Turnstile site key is public (shipped in the bundle); optional
          # until Supabase Attack Protection is enabled. See docs/operations/turnstile.md.
          if [[ -n "${TURNSTILE_SITE_KEY}" ]]; then
            upsert_eas_env "EXPO_PUBLIC_TURNSTILE_SITE_KEY" "${TURNSTILE_SITE_KEY}" "plaintext"
          fi

      - name: Publish EAS Update (production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          eas update \
            --channel production \
            --environment production \
            --message "Auto update from ${GITHUB_SHA::8}" \
            --non-interactive
