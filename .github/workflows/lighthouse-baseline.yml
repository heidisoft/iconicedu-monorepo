name: Lighthouse Baseline

# Runs after every push to main (via CI completion) to keep the baseline
# current. The stored scores are downloaded by preview-env.yml and shown
# as a "vs main" drift column in the PR comment.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

jobs:
  update-baseline:
    name: Update Lighthouse baseline
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The production Vercel deployment for main is available at the
      # project's production URL. Set LHCI_PRODUCTION_URL as a repo
      # secret or variable pointing to your production/preview base URL.
      # Falls back gracefully — baseline simply won't be written if unset.
      - name: Check production URL is configured
        id: url-check
        run: |
          if [[ -z "${{ vars.LHCI_PRODUCTION_URL }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LHCI_PRODUCTION_URL repo variable not set — skipping baseline update"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.LHCI_PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Lighthouse against production
        id: lighthouse
        if: steps.url-check.outputs.skip == 'false'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.url-check.outputs.url }}
          configPath: apps/web/lighthouserc.js
          uploadArtifacts: false
          temporaryPublicStorage: false

      # Extract the summary scores from the manifest and store as a
      # compact JSON file — only the four category scores are needed.
      - name: Write baseline JSON
        if: steps.url-check.outputs.skip == 'false' && steps.lighthouse.outputs.manifest != ''
        run: |
          node -e "
            const manifest = JSON.parse(process.env.LH_MANIFEST);
            const result   = manifest.find(r => r.isRepresentativeRun) || manifest[0];
            const s        = result.summary;
            const baseline = {
              performance:      s.performance,
              accessibility:    s.accessibility,
              'best-practices': s['best-practices'],
              seo:              s.seo,
              measuredAt:       new Date().toISOString(),
              url:              result.url,
            };
            require('fs').writeFileSync('/tmp/lighthouse-baseline.json', JSON.stringify(baseline, null, 2));
          "
        env:
          LH_MANIFEST: ${{ steps.lighthouse.outputs.manifest }}

      - name: Upload baseline artifact
        if: steps.url-check.outputs.skip == 'false' && steps.lighthouse.outputs.manifest != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-baseline
          path: /tmp/lighthouse-baseline.json
          # Keep for 90 days — long enough to survive quiet periods on main.
          retention-days: 90
          overwrite: true
