          PR_NUMBER: ${{ inputs.pr_number }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          FALLBACK_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          FALLBACK_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          FALLBACK_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          FALLBACK_WEB_URL: ${{ secrets.EXPO_PUBLIC_WEB_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER}" ]]; then
            if [[ "${BRANCH_NAME}" != "main" ]]; then
              echo "::error::PR number is required when building a branch other than main."
              exit 1
