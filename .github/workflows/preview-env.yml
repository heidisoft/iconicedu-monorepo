name: 'Preview Environment'

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: 'preview-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BRANCH_NAME: ${{ github.head_ref }}

jobs:
  create-preview-env:
    name: 'Create Preview Environment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 1. Create Supabase preview branch
      - name: Create Supabase branch
        id: supabase-branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="pr-${PR_NUMBER}"

          # Check if branch already exists (synchronize runs reuse the same branch)
          EXISTING_ID=$(supabase branches list \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --output json \
            | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name==$name) | .id // ""')

          if [[ -z "$EXISTING_ID" ]]; then
            echo "Creating new branch: $BRANCH_NAME"
            supabase branches create \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --name "$BRANCH_NAME" \
              --region ap-southeast-1 \
              2>&1 || true
            echo "branch_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $BRANCH_NAME already exists (id: $EXISTING_ID)"
            echo "branch_new=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Waiting for branch migrations to complete..."
          for i in $(seq 1 30); do
            STATUS=$(supabase branches list \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --output json \
              | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name==$name) | .status')

            BRANCH_ID=$(supabase branches list \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              --output json \
              | jq -r --arg name "$BRANCH_NAME" '.[] | select(.name==$name) | .id')

            echo "  Status: $STATUS"

            if [[ "$STATUS" == "MIGRATIONS_PASSED" ]]; then
              echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
              break
            elif [[ "$STATUS" == "MIGRATIONS_FAILED" ]]; then
              echo "::error::Supabase branch migrations failed"
              exit 1
            fi

            if [[ $i -eq 30 ]]; then
              echo "::error::Timed out waiting for Supabase branch"
              exit 1
            fi
            sleep 10
          done

      # 2. Fetch branch credentials
      - name: Fetch branch credentials
        id: branch-creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_ID="${{ steps.supabase-branch.outputs.branch_id }}"

          # Get branch project ref
          BRANCH_REF=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/branches/${BRANCH_ID}" \
            | jq -r '.project_ref')
          echo "branch_ref=$BRANCH_REF" >> "$GITHUB_OUTPUT"
          echo "Branch project ref: $BRANCH_REF"

          # Get API keys
          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/api-keys" \
            | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "::add-mask::$ANON_KEY"
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"

          SERVICE_ROLE_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/api-keys" \
            | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "service_role_key=$SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"

          # Build connection strings (transaction pooler for app, session for migrations)
          # Region derived from prod project — update if your Supabase region differs
          REGION="ap-southeast-1"
          DB_PASS="${{ secrets.SUPABASE_DB_PASSWORD }}"
          echo "::add-mask::$DB_PASS"
          DATABASE_URL="postgresql://postgres.${BRANCH_REF}:${DB_PASS}@aws-0-${REGION}.pooler.supabase.com:6543/postgres"
          # Direct (non-pooled) connection — required for COPY FROM stdin in seed and Prisma migrations
          DIRECT_URL="postgresql://postgres:${DB_PASS}@db.${BRANCH_REF}.supabase.co:5432/postgres"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DIRECT_URL"
          echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT_URL" >> "$GITHUB_OUTPUT"

          # Get JWT secret
          JWT_SECRET=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${BRANCH_REF}/config/auth" \
            | jq -r '.jwt_secret')
          echo "::add-mask::$JWT_SECRET"
          echo "jwt_secret=$JWT_SECRET" >> "$GITHUB_OUTPUT"

          echo "branch_api_url=https://${BRANCH_REF}.supabase.co" >> "$GITHUB_OUTPUT"

      # 3. Seed preview branch (new branches only)
      - name: Seed preview branch
        if: steps.supabase-branch.outputs.branch_new == 'true'
        env:
          DIRECT_URL: ${{ steps.branch-creds.outputs.direct_url }}
        run: |
          psql "$DIRECT_URL" -f supabase/seed.sql

      # 4. Deploy edge functions (no cron triggers)
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          BRANCH_REF="${{ steps.branch-creds.outputs.branch_ref }}"
          for fn in reminders-dispatch notifications-dispatch channel-read-state-repair; do
            supabase functions deploy "$fn" \
              --project-ref "$BRANCH_REF" \
              --no-verify-jwt \
              2>&1 || echo "Warning: failed to deploy $fn (non-fatal)"
          done
          # Note: cron triggers are NOT configured on preview branches,
          # so functions exist but won't fire automatically.

      # 5. Deploy Railway preview environment
      - name: Deploy Railway preview API
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g @railway/cli --silent

          ENV_NAME="pr-${PR_NUMBER}"

          # Create environment (ignore error if exists)
          railway environment create "$ENV_NAME" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" 2>/dev/null || true

          # Set environment variables
          railway variables set \
            --environment "$ENV_NAME" \
            --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            "DATABASE_URL=${{ steps.branch-creds.outputs.database_url }}" \
            "DIRECT_URL=${{ steps.branch-creds.outputs.direct_url }}" \
            "SUPABASE_URL=${{ steps.branch-creds.outputs.branch_api_url }}" \
            "SUPABASE_SERVICE_ROLE_KEY=${{ steps.branch-creds.outputs.service_role_key }}" \
            "JWT_SECRET=${{ steps.branch-creds.outputs.jwt_secret }}" \
            "INTERNAL_REMINDERS_TOKEN_API=${{ secrets.INTERNAL_REMINDERS_TOKEN }}" \
            "INTERNAL_NOTIFICATIONS_TOKEN=${{ secrets.INTERNAL_NOTIFICATIONS_TOKEN }}" \
            "NODE_ENV=production" \
            "NEXT_PUBLIC_APP_ENV=preview" \
            "POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}" \
            "POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}"

          # Deploy
          railway up \
            --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
            --environment "$ENV_NAME" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --detach

          # Wait for healthcheck (max 3 min)
          echo "Waiting for Railway API to become healthy..."
          for i in $(seq 1 18); do
            RAILWAY_API_URL=$(railway domain \
              --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
              --environment "$ENV_NAME" \
              --project "${{ secrets.RAILWAY_PROJECT_ID }}" 2>/dev/null || echo "")

            if [[ -n "$RAILWAY_API_URL" ]]; then
              HEALTH_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
                "https://${RAILWAY_API_URL}/healthz" 2>/dev/null || echo "000")
              echo "  Health: $HEALTH_STATUS (attempt $i)"
              if [[ "$HEALTH_STATUS" == "200" ]]; then
                echo "railway_api_url=https://${RAILWAY_API_URL}" >> "$GITHUB_OUTPUT"
                break
              fi
            fi
            if [[ $i -eq 18 ]]; then
              echo "::warning::Railway API health check timed out — URL may not be ready yet"
              echo "railway_api_url=https://${RAILWAY_API_URL:-pending}" >> "$GITHUB_OUTPUT"
            fi
            sleep 10
          done

      # 6. Set Vercel branch env vars
      - name: Configure Vercel preview env vars
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          BRANCH="${{ env.BRANCH_NAME }}"

          set_vercel_env() {
            local KEY="$1" VALUE="$2"
            # Delete existing branch-scoped var if present
            EXISTING_ID=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?gitBranch=${BRANCH}" \
              | jq -r --arg k "$KEY" '.envs[] | select(.key==$k) | .id' 2>/dev/null || echo "")

            if [[ -n "$EXISTING_ID" ]]; then
              curl -sf -X DELETE \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v10/projects/${PROJECT_ID}/env/${EXISTING_ID}" > /dev/null
            fi

            curl -sf -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
              -d "{
                \"key\": \"$KEY\",
                \"value\": \"$VALUE\",
                \"target\": [\"preview\"],
                \"gitBranch\": \"$BRANCH\",
                \"type\": \"encrypted\"
              }" > /dev/null
          }

          set_vercel_env "NEXT_PUBLIC_SUPABASE_URL"      "${{ steps.branch-creds.outputs.branch_api_url }}"
          set_vercel_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "${{ steps.branch-creds.outputs.anon_key }}"
          set_vercel_env "SUPABASE_SERVICE_ROLE_KEY"     "${{ steps.branch-creds.outputs.service_role_key }}"
          set_vercel_env "NEXT_PUBLIC_API_URL"           "${{ steps.railway.outputs.railway_api_url }}"
          set_vercel_env "NEXT_PUBLIC_APP_ENV"           "preview"

          # Trigger a redeploy so the new env vars take effect
          LATEST_DEPLOYMENT=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&target=preview&limit=1&meta-githubCommitRef=${BRANCH}" \
            | jq -r '.deployments[0].url // ""')

          if [[ -n "$LATEST_DEPLOYMENT" ]]; then
            echo "vercel_url=https://${LATEST_DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_url=https://vercel.com/dashboard (deployment in progress)" >> "$GITHUB_OUTPUT"
          fi

      # 7. Post PR comment
      - name: Post preview environment comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const webUrl = '${{ steps.vercel.outputs.vercel_url }}';
            const apiUrl = '${{ steps.railway.outputs.railway_api_url }}';
            const branchRef = '${{ steps.branch-creds.outputs.branch_ref }}';
            const studioUrl = `https://supabase.com/dashboard/project/${branchRef}`;

            const body = [
              '## Preview Environment Ready',
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| Web (Vercel) | ${webUrl} |`,
              `| API (Railway) | ${apiUrl}/healthz |`,
              `| Supabase Studio | ${studioUrl} |`,
              '',
              '**Seed credentials** (password: `Seed123!` for all)',
              '| Email | Role |',
              '|-------|------|',
              '| heshanmw@gmail.com | Owner (Marc F) |',
              '| heshanmw+1@gmail.com | Guardian (Lura H) |',
              '| heshanmw+3@gmail.com | Educator (Denise R) |',
              '| heshanmw+4@gmail.com | Educator (Barbara Y) |',
              '| heshanmw+5@gmail.com | Staff (Harold B) |',
              '| heshanmw+6@gmail.com | Guardian (Jessica K) |',
              '',
              `**Mobile build** - [Actions -> EAS Preview Build](../../actions/workflows/eas-preview-build.yml) -> PR number: \`${prNumber}\``,
            ].join('\n');

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Environment Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
