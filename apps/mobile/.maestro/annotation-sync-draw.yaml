appId: com.heidisoft.iconicedu
---
- runFlow: bootstrap.yaml
- openLink: 'iconicedu://annotation-sync-fixture?run=${RUN_ID}'
- extendedWaitUntil:
    visible:
      id: 'annotation-saved-elements-1'
    timeout: 30000
- swipe:
    start: '25%,25%'
    end: '60%,30%'
    duration: 1000
- extendedWaitUntil:
    visible:
      id: 'annotation-saved-elements-2'
    timeout: 30000
