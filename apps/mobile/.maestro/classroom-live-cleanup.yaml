appId: com.heidisoft.iconicedu
name: Release the dedicated live test meeting after a failed journey
---
- runFlow:
    when:
      visible: 'Expand whiteboard to full screen'
    commands:
      - runFlow: hide-classroom-whiteboard.yaml
- runFlow:
    when:
      visible: 'Leave class|Leave or end class|End class'
    commands:
      - tapOn: 'Leave class|Leave or end class|End class'
      - tapOn: 'End for everyone|End class|Leave'
