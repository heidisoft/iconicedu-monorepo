appId: com.heidisoft.iconicedu
name: Native classroom UI lifecycle on iPad and Android tablets
---
- runFlow: bootstrap.yaml
- openLink: iconicedu://classroom-fixture
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible: 'Ready to join\?'
    timeout: 30000
- assertVisible: 'Native SDK [0-9].*'
- assertVisible: 'Test teacher'
- tapOn: 'Turn camera off'
- scrollUntilVisible:
    element: 'Settings'
- tapOn: 'Settings'
- tapOn: 'Video settings tab'
- assertVisible: 'Choose background image'
- tapOn: 'Camera device: Back camera'
- assertVisible:
    id: 'camera-device-back-selected'
- tapOn: 'Camera device: Front camera'
- tapOn: 'Audio settings tab'
- tapOn: 'Audio device: Test headset'
- assertVisible:
    id: 'audio-device-headset-selected'
- tapOn: 'Audio device: Speaker'
- scrollUntilVisible:
    element: 'Test speakers'
- tapOn: 'Test speakers'
- assertVisible: 'Stop speaker test'
- tapOn: 'Stop speaker test'
- tapOn: 'Close settings'
- scrollUntilVisible:
    element: 'Join now'
    direction: UP
- tapOn: 'Join now'
- assertVisible: 'Native classroom test'
- tapOn: 'Focus Test student'
- assertVisible: 'Close focused video'
- tapOn: 'Close focused video'
- scrollUntilVisible:
    element: 'More controls'
    direction: UP
- tapOn: 'More controls'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Raise hand'
- runFlow: open-classroom-controls.yaml
- tapOn: 'Raise hand'
- runFlow: open-classroom-controls.yaml
- assertVisible: 'Lower hand'
- runFlow: open-classroom-controls.yaml
- tapOn: 'Lower hand'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Messages'
- tapOn: 'Messages'
- scrollUntilVisible:
    element: 'Message'
- tapOn: 'Message'
- inputText: 'Hello from native tablet'
- scrollUntilVisible:
    element: 'Send message'
- tapOn: 'Send message'
- assertVisible: 'Hello from native tablet'
- assertVisible: 'You'
- tapOn: 'Close In-call Messages'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Start recording'
    direction: UP
- runFlow: open-classroom-controls.yaml
- tapOn: 'Start recording'
- scrollUntilVisible:
    element: 'Recording active'
    direction: UP
- assertVisible: 'Recording active'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Pause recording'
- tapOn: 'Pause recording'
- assertVisible: 'Recording paused'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Resume recording'
- tapOn: 'Resume recording'
- assertVisible: 'Recording active'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Stop recording'
- runFlow: open-classroom-controls.yaml
- tapOn: 'Stop recording'
- runFlow: open-classroom-controls.yaml
- scrollUntilVisible:
    element: 'Whiteboard'
    direction: UP
- runFlow: open-classroom-controls.yaml
- tapOn: 'Whiteboard'
- tapOn: 'Whiteboard options'
- scrollUntilVisible:
    element: 'Allow student editing'
- tapOn: 'Allow student editing'
- assertVisible: 'Disable student editing'
- assertVisible: 'Stop presenting board'
- tapOn: 'Return to video'
- assertNotVisible: 'Return to video'
- tapOn: 'Leave or end class'
- tapOn: 'Leave'
- assertVisible: 'You left the classroom'
