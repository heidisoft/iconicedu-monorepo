appId: com.heidisoft.iconicedu
name: Write and draw on the real native whiteboard canvas and reopen saved content
---
- runFlow: bootstrap.yaml
- openLink: iconicedu://classroom-fixture
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: 'Ready to join\?'
    timeout: 30000
- tapOn: 'Turn camera off'
- scrollUntilVisible:
    element: 'Join now'
- tapOn: 'Join now'
- runFlow: open-classroom-controls.yaml
- tapOn: 'Whiteboard'
- extendedWaitUntil:
    visible: 'Return to video'
    timeout: 30000
- tapOn: 'Draw'
- swipe:
    start: '45%,45%'
    end: '60%,55%'
    duration: 1000
- extendedWaitUntil:
    visible:
      id: 'whiteboard-saved-elements-1'
    timeout: 30000
- tapOn: 'Text'
- tapOn:
    point: '45%,60%'
- inputText: 'Tablet whiteboard writing'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'whiteboard-saved-elements-2'
    timeout: 30000
- tapOn: 'Return to video'
- assertNotVisible: 'Return to video'
- runFlow: open-classroom-controls.yaml
- tapOn: 'Whiteboard'
- extendedWaitUntil:
    visible:
      id: 'whiteboard-saved-elements-2'
    timeout: 30000
- tapOn: 'Return to video'
- tapOn: 'Leave or end class'
- tapOn: 'Leave'
- assertVisible: 'You left the classroom'
