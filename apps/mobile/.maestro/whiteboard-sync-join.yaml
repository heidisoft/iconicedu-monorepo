appId: com.heidisoft.iconicedu
---
- runFlow: bootstrap.yaml
- openLink: 'iconicedu://whiteboard-sync-fixture?role=student'
- extendedWaitUntil:
    visible: 'Ready to join\?'
    timeout: 30000
- tapOn: 'Turn camera off'
- scrollUntilVisible:
    element: 'Join now'
- tapOn: 'Join now'
- extendedWaitUntil:
    visible: 'Cross-client classroom'
    timeout: 30000
- assertNotVisible: 'Class whiteboard'
